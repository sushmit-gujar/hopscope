[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hopscope"
version = "0.1.0"
description = "Key-free benchmark harness: when does knowledge-graph retrieval (GraphRAG / Personalized PageRank) beat vector RAG on multi-hop QA? Evidence recall, answer accuracy, attribution and latency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sushmit Gujar", email = "sushmit.gujar@gmail.com" }]
keywords = ["rag", "graphrag", "knowledge-graph", "evaluation", "llm", "retrieval", "hotpotqa", "personalized-pagerank"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
local = [
  "fastembed>=0.4",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.23",
  "pyarrow>=15",
]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
hopscope = "hopscope.cli:main"

[project.urls]
Homepage = "https://github.com/sushmit-gujar/hopscope"
Demo = "https://sushmit-gujar.github.io/hopscope/"

[tool.hatch.build.targets.wheel]
packages = ["src/hopscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "SIM905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
