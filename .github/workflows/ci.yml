name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Offline smoke benchmark (hashing encoder, lexical reader)
        run: hopscope run --data tests/fixtures/hotpot_mini.json -n 30 --encoder hashing --reader lexical --methods bm25,dense,hybrid,graph_ppr,graph_ppr+dense,oracle --out /tmp/smoke
